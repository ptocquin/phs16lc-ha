      - sensor.spot_4_temp_led1
      - sensor.spot_4_temp_led2
      - sensor.spot_5_temp_cpu
      - sensor.spot_5_temp_led1
      - sensor.spot_5_temp_led2
      - sensor.spot_6_temp_cpu
      - sensor.spot_6_temp_led1
      - sensor.spot_6_temp_led2
      - sensor.spot_7_temp_cpu
      - sensor.spot_7_temp_led1
      - sensor.spot_7_temp_led2
      line_width: 2
      show:
        legend: true
        points: false
    - type: gauge
      name: Serre 1 — temp max
      entity: sensor.serre_1_temp_max
      min: 0
      max: 80
      severity:
        green: 0
        yellow: 50
        red: 65
