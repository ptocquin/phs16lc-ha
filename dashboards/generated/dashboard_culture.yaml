# Dashboard Lovelace « Culture » (vues sections).
# Généré par dashboards/generate_dashboards.py — ne pas éditer à la main.
title: Culture
icon: mdi:sprout
views:
- title: Vue d'ensemble
  path: overview
  type: sections
  sections:
  - type: grid
    cards:
    - type: markdown
      content: '**À l''install** : poser les labels `<chambre>_<groupe>` sur les devices SPOT, créer areas + helpers (voir
        `dashboards/generated/helpers_a_creer.md`), ajuster l''entity_id du capteur `line_status` (device hub, dépend du port
        série).'
    - type: tile
      entity: light.serre_1_tous
      name: Serre 1
      icon: mdi:sprout
      tap_action:
        action: navigate
        navigation_path: /culture/serre_1
      features:
      - type: light-brightness
    - type: tile
      entity: sensor.serre_1_temp_max
      name: Serre 1 — temp max
    - type: tile
      entity: binary_sensor.serre_1_hors_ligne
      name: Serre 1 — carte HS
    - type: tile
      entity: light.serre_2_tous
      name: Serre 2
      icon: mdi:sprout
      tap_action:
        action: navigate
        navigation_path: /culture/serre_2
      features:
      - type: light-brightness
    - type: tile
      entity: sensor.serre_2_temp_max
      name: Serre 2 — temp max
    - type: tile
      entity: binary_sensor.serre_2_hors_ligne
      name: Serre 2 — carte HS
    - type: tile
      entity: sensor.phs16_lc_line_status
      name: Cartes en ligne (bus)
