      content: 'Boutons **Scanner la ligne** et **Scène …** : sur le device hub PHS16-LC (entity_id dépendant du port série,
        ex. `button.phs16_lc_dev_ttyusb0_scan`).'
- title: Monitoring
  path: monitoring
  type: sections
  sections:
  - type: grid
    cards:
    - type: custom:mini-graph-card
      name: Serre 1 — températures
      entities:
      - sensor.spot_1_temp_cpu
      - sensor.spot_1_temp_led1
      - sensor.spot_1_temp_led2
      - sensor.spot_2_temp_cpu
      - sensor.spot_2_temp_led1
      - sensor.spot_2_temp_led2
      - sensor.spot_3_temp_cpu
      - sensor.spot_3_temp_led1
