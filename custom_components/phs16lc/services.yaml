# Services exposés par l'intégration PHS16-LC (handlers enregistrés en phase 6).
# `address` accepte un numéro de carte ("1"), "all" (toutes les cartes scannées)
# ou "group:<id>" (groupe de luminaires de groups.json).
#
# set_group / remove_group : création/modification/suppression des groupes de
# luminaires depuis l'UI (Outils de développement → Actions) — réécrivent
# <config>/phs16lc/groups.json, rechargé à chaud par le coordinator.

scan:
  fields: {}

provision:
  fields: {}

apply_recipe:
  fields:
    address:
      required: true
      selector:
        text:
    recipe:
      required: true
      selector:
        text:
    group:
      required: false
      selector:
        text:

apply_scene:
  fields:
    file:
      required: true
      selector:
        text:
    save:
      required: false
      default: false
      selector:
        boolean:

save:
  fields:
    address:
      required: true
      selector:
        text:

save_recipe:
  fields:
    name:
      required: true
      selector:
        text:
    address:
      required: true
      selector:
        text:
    description:
      required: false
      selector:
        text:
    currents:
      required: false
      selector:
        text:
    overwrite:
      required: false
      default: false
      selector:
        boolean:

delete_recipe:
  fields:
    recipe:
      required: true
      selector:
        text:

set_channels:
  fields:
    address:
      required: true
      selector:
        text:
    currents:
      required: true
      selector:
        text:

set_channel:
  fields:
    address:
      required: true
      selector:
        text:
    channel:
      required: true
      selector:
        number:
          min: 1
          max: 16
          step: 1
          mode: box
    ma:
      required: true
      selector:
        number:
          min: 0
          max: 2150
          step: 1
          mode: box

set_fan_settings:
  fields:
    address:
      required: true
      selector:
        text:
    low_temp:
      required: true
      selector:
        number:
          min: 0
          max: 74
          step: 1
          mode: box
          unit_of_measurement: "°C"
    high_temp:
      required: true
      selector:
        number:
          min: 1
          max: 75
          step: 1
          mode: box
          unit_of_measurement: "°C"
    min_duty:
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: box
          unit_of_measurement: "%"

set_group:
  fields:
    group_id:
      required: true
      selector:
        text:
    new_group_id:
      required: false
      selector:
        text:
    name:
      required: false
      selector:
        text:
    spots:
      required: false
      selector:
        entity:
          integration: phs16lc
          domain: light
          multiple: true
    addresses:
      required: false
      selector:
        text:
    color:
      required: false
      selector:
        text:
    icon:
      required: false
      selector:
        icon:
    area:
      required: false
      selector:
        area:
    port:
      required: false
      selector:
        text:

remove_group:
  fields:
    group_id:
      required: true
      selector:
        text:
    port:
      required: false
      selector:
        text:
